<svg viewBox="0 0 42 42" role="img" [attr.aria-label]="centerLabel() + ' ' + totalLabel()">
  <circle cx="21" cy="21" r="15.9155" fill="none" stroke="var(--app-surface-high)" stroke-width="4.5" />
  @for (arc of arcs(); track arc.index) {
    <circle
      cx="21"
      cy="21"
      r="15.9155"
      fill="none"
      stroke-width="4.5"
      stroke-linecap="round"
      [attr.stroke-dasharray]="arc.dashArray"
      [attr.stroke-dashoffset]="arc.dashOffset"
      [style.stroke]="arc.color"
    />
  }
  <text x="21" y="21.5" text-anchor="middle" class="total">{{ totalLabel() }}</text>
  <text x="21" y="26" text-anchor="middle" class="caption">{{ centerLabel() }}</text>
</svg>
<ion-list lines="none">
  @for (item of legend(); track item.label) {
    <ion-item>
      <ion-icon slot="start" name="square" aria-hidden="true" [style.color]="item.color" />
      <ion-label>{{ item.label }}</ion-label>
      <ion-text slot="end" class="app-number">{{ item.amount }}</ion-text>
      <ion-note slot="end" class="app-number">{{ item.percent }}</ion-note>
    </ion-item>
  } @empty {
    <ion-item>
      <ion-label class="app-muted">No tax collected yet.</ion-label>
    </ion-item>
  }
</ion-list>
